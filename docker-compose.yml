services:
  postgres:
    image: postgres:16-alpine
    container_name: card-status-db
    environment:
      POSTGRES_DB: carddb
      POSTGRES_USER: carduser
      POSTGRES_PASSWORD: cardpass
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carduser -d carddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-1: &kafka-broker
    image: apache/kafka:3.9.0
    container_name: card-status-kafka-1
    ports:
      - "9092:9092"
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://card-status-kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@card-status-kafka-1:9093,2@card-status-kafka-2:9093,3@card-status-kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # 3 brokers -> replication factor 3 is now real, not a workaround
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3

  kafka-2:
    <<: *kafka-broker
    container_name: card-status-kafka-2
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://card-status-kafka-2:29092,PLAINTEXT_HOST://localhost:9094

  kafka-3:
    <<: *kafka-broker
    container_name: card-status-kafka-3
    ports:
      - "9095:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://card-status-kafka-3:29092,PLAINTEXT_HOST://localhost:9095

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: card-status-kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: card-status-kafka-1:29092,card-status-kafka-2:29092,card-status-kafka-3:29092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  card-status-mock:
    image: wiremock/wiremock:3.9.1
    container_name: card-status-mock
    ports:
      - "8080:8080"
    volumes:
      - ./src/test/resources/wiremock/mappings:/home/wiremock/mappings
    command:
      - "--global-response-templating"

  dozzle:
    image: amir20/dozzle:latest
    container_name: card-status-dozzle
    ports:
      - "8083:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    build: .
    container_name: card-status-app
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
      card-status-mock:
        condition: service_started

volumes:
  pg-data:
